<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email to receive a magic link</p>

<form action="#" class="flex flex-col gap-md mt-sm" method="POST">
<div class="flex flex-col gap-xs">

<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/60 text-on-surface font-body-md rounded-DEFAULT py-sm pl-[40px] pr-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-md text-label-md uppercase tracking-wider py-md px-lg rounded-DEFAULT flex items-center justify-center gap-sm transition-colors mt-sm active:scale-[0.98]" type="submit">
<span>Send Link</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
