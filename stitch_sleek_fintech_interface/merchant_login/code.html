<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rubix - Merchant Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {

            theme: {
                extend: {
                    "colors": {

                        "primary-container": "#10b981",
                        "inverse-primary": "#006c49",
                        "surface-container-lowest": "#0b0f10",
                        "surface-dim": "#101415",
                        "on-surface": "#e0e3e4",
                        "surface-container-low": "#181c1d",
                        "inverse-on-surface": "#2d3132",
                        "error": "#ffb4ab",

                        "on-tertiary": "#213145",
                        "surface-container-highest": "#313536",
                        "tertiary": "#b7c8e1",
                        "secondary-fixed-dim": "#95d3ba",
                        "on-error": "#690005",
                        "inverse-surface": "#e0e3e4",
                        "on-tertiary-container": "#2a3a4f",
                        "primary": "#4edea3",
                        "secondary": "#95d3ba",
                        "secondary-container": "#0b513d",
                        "tertiary-container": "#94a4bd",
                        "surface": "#101415",
                        "on-primary-container": "#00422b",
                        "surface-container": "#1c2021",
                        "on-surface-variant": "#bbcabf",

                        "on-secondary-fixed-variant": "#0b513d",

                        "surface-variant": "#313536",
                        "outline-variant": "#3c4a42",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "container-margin": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px",

                        "unit": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {

<style>
        .mesh-bg {
            background-image: radial-gradient(at 0% 0%, rgba(78, 222, 163, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(78, 222, 163, 0.02) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative Technical Background -->
<div aria-hidden="true" class="absolute inset-0 mesh-bg pointer-events-none"></div>
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(#3c4a42 1px, transparent 1px), linear-gradient(90deg, #3c4a42 1px, transparent 1px); background-size: 24px 24px;"></div>
<main class="w-full max-w-[420px] px-gutter relative z-10">
<!-- Logo / Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-DEFAULT bg-surface-container-low border border-outline-variant mb-md">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">
                    dataset
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Rubix</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Merchant Access Terminal</p>
</div>
<!-- Login Card -->
<div class="bg-surface border border-outline-variant rounded-lg p-lg">
<form action="#" class="space-y-md" method="POST">
<!-- Email Input -->
<div>
<label class="font-label-md text-label-md text-on-surface-variant block mb-xs" for="email">
                        Work Email
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">
                            mail
                        </span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-sm font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">
                            Forgot?
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">
                            key
                        </span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-sm font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-DEFAULT hover:bg-primary-fixed transition-colors flex items-center justify-center gap-xs mt-md" type="submit">
                    Initialize Session
                    <span class="material-symbols-outlined text-[16px]">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-sm font-label-sm text-label-sm text-outline-variant">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary CTA -->
<button class="w-full bg-transparent border border-outline-variant text-primary font-label-md text-label-md py-sm rounded-DEFAULT hover:bg-surface-container-high transition-colors flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined text-[16px]">
                    terminal
                </span>
                Authenticate via API Key
            </button>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-center gap-md">
<a class="hover:text-primary transition-colors" href="#">System Status</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="hover:text-primary transition-colors" href="#">Support</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="hover:text-primary transition-colors" href="#">Documentation</a>
</p>
</div>
</main>
</body></html>
