<style>
        .shadow-level-1 {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.03);
        }
        .shadow-level-2 {
            box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.06);
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- Suppressed TopNavBar & SideNavBar due to transactional checkout intent -->
<main class="flex-grow flex items-center justify-center p-md md:p-gutter">
<div class="w-full max-w-md mx-auto">
<!-- Progress Indicator -->
<div class="w-full bg-surface-container-high h-1 mb-xl rounded-full overflow-hidden">
<div class="bg-primary-container h-full w-1/3 rounded-full"></div>
</div>
<!-- Header -->
<header class="mb-xl text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Complete Checkout</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide your details to securely finalize your subscription to Rubix.</p>
</header>
<!-- Plan Summary Card (Bento Style) -->
<div class="bg-surface-container-lowest rounded-xl p-gutter shadow-level-1 mb-xl relative overflow-hidden border border-outline-variant/30">
<div class="absolute top-0 right-0 bg-primary-container/10 text-primary-container px-3 py-1 rounded-bl-lg font-label-md text-label-md font-bold">
                    Pro Plan
                </div>
<div class="flex items-center gap-md mb-sm">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-2xl" style="font-variation-settings: 'FILL' 1;">layers</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Rubix Workspace</h2>
<p class="font-label-md text-label-md text-on-surface-variant">Billed monthly</p>
</div>
</div>
<div class="mt-md pt-md border-t border-outline-variant/20 flex justify-between items-end">
<span class="font-body-md text-body-md text-on-surface-variant">Total due today</span>
<span class="font-headline-lg text-headline-lg text-on-surface">$29.00</span>
</div>
</div>
<!-- Checkout Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Full Name Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface font-semibold ml-1" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container focus:outline-none transition-all shadow-sm" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface font-semibold ml-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container focus:outline-none transition-all shadow-sm" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface font-semibold ml-1" for="phone">Phone Number <span class="text-on-surface-variant font-normal">(Optional)</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">phone_iphone</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container focus:outline-none transition-all shadow-sm" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Secure Notice -->
<div class="flex items-center gap-2 mt-md text-on-surface-variant justify-center bg-surface-container-low py-2 rounded-lg border border-outline-variant/20">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="font-label-md text-label-md">Secure 256-bit SSL encryption</span>
</div>
<!-- Actions -->
<div class="pt-xl flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary-container font-body-md text-body-md py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed hover:text-on-primary-fixed transition-colors shadow-level-2 border-none" type="submit">
                        Continue to Payment
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<button class="w-full bg-transparent text-primary-container font-body-md text-body-md py-3 rounded-lg hover:bg-surface-container-low transition-colors" type="button">
                        Cancel
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer injected styling from JSON, but suppressed full layout since this is a transactional page, keeping a minimal secure footer -->
<footer class="bg-surface py-xl px-gutter flex flex-col items-center border-t border-outline-variant/20 mt-auto">
<p class="font-label-md text-label-md text-on-surface-variant text-center">
            © 2024 Rubix. Secure infrastructure for modern payments.
         </p>
</footer>
</body></html>
